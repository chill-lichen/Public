# Netlify publishes the unified website from this GitHub repository.
# Git connection: chill-lichen/Public, production branch: main.
# Plain HTML/CSS/JS: no build command, package install, or framework needed.
[build]
  publish = "docs/unified"

# Don't redirect all routes to index.html: this is a real multi-page site.

# Keep URLs consistent across canonical tags, site links, and sitemap.
[build.processing.html]
  pretty_urls = true

# Retired fictional sample work page: send saved links to the real services page.
[[redirects]]
  from = "/work"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/work.html"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/work/*"
  to = "/services/"
  status = 301
